[project]
name = "paletted"
version = "1.0.3"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.26.3",
    "typing-extensions>=4.15.0",
]

authors = [
    { name = "PixelLoop-uwu", email = "anything@pixelloop.dev" }
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paletted"]

[project.scripts]
paletted = "paletted.cli:app"
